name: Daily Overdue Briefing

# ⏸️ 2026-08-04 스케줄 중단 (보류). 수동 실행만 가능.
#
# 중단 사유:
#   1. 2026-08-01 키 교체 때 Actions 시크릿 VITE_SUPABASE_ANON_KEY 가 사라져
#      8/2 실행분부터 "Missing Supabase Environment Variables" 로 매일 실패했다.
#   2. DISCORD_WEBHOOK_URL 시크릿도 등록돼 있지 않다. 스크립트는 웹훅이 없으면
#      경고만 찍고 exit 0 하므로, 실패 이전의 "성공" 초록불도 실제로는
#      디스코드에 아무것도 보내지 않았을 가능성이 크다.
#   3. 현재 연체 확인은 Admin 대시보드로 하고 있어 당장 필요하지 않다.
#
# 되살릴 때 할 일 (anon 키 복구만으로는 반쪽이다):
#   - 키를 SUPABASE_SERVICE_ROLE_KEY 로 바꿀 것. anon 키로는 profiles 를 못 읽어
#     (RLS: Read Own Profile / Admin Read All Profiles) 연체자 이름·전화번호가
#     전부 null 로 내려온다. cleanup.yml 이 같은 이유로 service_role 을 쓴다.
#   - DISCORD_WEBHOOK_URL 시크릿 등록 (.env.local 에 값 있음).
#   - daily_briefing.js 가 웹훅 없을 때 exit 1 하도록 고칠 것.
#     안 그러면 또 초록불로 조용히 무동작한다.
#   - 아래 schedule 주석 해제.
on:
  # schedule:
  #   # 매일 한국 시간 오전 9시 (UTC 00:00)
  #   - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install @supabase/supabase-js dotenv

      - name: Run Briefing Script
        run: node admin_notifications/daily_briefing.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

name: Cleanup Expired Dibs
on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 실행
  workflow_dispatch: # 수동 실행 버튼

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Cleanup RPC
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # anon 에는 cleanup_expired_dibs EXECUTE 권한이 없다 (42501).
          # service_role 키로 호출해야 한다.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # --fail-with-body: HTTP 4xx/5xx 면 본문을 출력하고 exit 1 → Actions 가 실패로 표시.
          # 이게 없으면 권한 오류가 나도 워크플로가 계속 초록불로 뜬다.
          curl --fail-with-body -sS -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/cleanup_expired_dibs" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json"
